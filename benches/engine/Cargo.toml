[package]
name = "xsync-engine-bench"
description = "Isolated scanner, planner, and memory benchmark runner for xsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xsync-engine-bench"
path = "src/main.rs"

[[bin]]
name = "xsync-clone-bench"
path = "src/bin/xsync-clone-bench.rs"

[[bin]]
name = "xsync-remote-spike"
path = "src/bin/xsync-remote-spike.rs"

[[bin]]
name = "xsync-strategy-bench"
path = "src/bin/xsync-strategy-bench.rs"

[[bin]]
name = "xsync-connection-bench"
path = "src/bin/xsync-connection-bench.rs"

[lints]
workspace = true

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xsync-bench = { path = ".." }
xsync-core = { path = "../../crates/xsync-core" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

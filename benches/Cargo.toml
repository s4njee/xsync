[package]
name = "xsync-bench"
description = "Reproducible benchmark reporting, correctness oracle, and regression gates for xsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xsync-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
indicatif = "0.17"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

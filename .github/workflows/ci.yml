name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  target:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Without a ceiling a job that cannot get a runner sits in the queue until
    # the 24-hour maximum, so a retired runner label reads as "still running"
    # for a day instead of failing fast.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            tool: cargo
          - target: x86_64-apple-darwin
            # macos-13 was retired in December 2025; jobs requesting it wait for
            # a runner that no longer exists until the 24h ceiling. macos-15-intel
            # is the Intel replacement and is available until August 2027, after
            # which x86_64-apple-darwin needs a Tier 1 decision (see
            # docs/TARGET-MATRIX.md).
            runner: macos-15-intel
            tool: cargo
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cargo
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            tool: cross
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            tool: cargo
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            tool: cross
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            tool: cargo
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux musl toolchain
        if: runner.os == 'Linux' && endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install cross
        if: matrix.tool == 'cross'
        uses: taiki-e/install-action@cross
      - name: Build
        run: ${{ matrix.tool }} build --workspace --locked --target ${{ matrix.target }}
      - name: Test
        run: ${{ matrix.tool }} test --workspace --locked --target ${{ matrix.target }}
      - name: Clippy
        run: ${{ matrix.tool }} clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --locked

name: Release

# A tag cuts the release. workflow_dispatch runs the same jobs without
# publishing, so the pipeline can be exercised without minting a version --
# a release process first tested during a release is tested in the worst
# possible place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check artifacts without publishing"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse before building anything if the tag and the manifest disagree. A
  # binary reporting a version different from the tag it shipped under is worse
  # than no version at all, and the cheapest place to catch that is here.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "manifest version: $manifest"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $manifest"
              exit 1
            fi
            echo "tag matches manifest"
          fi
      - run: test -f LICENSE-MIT && test -f LICENSE-APACHE
      - name: Changelog entry exists for this version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "## \[\?$version\]\?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,        runner: macos-14 }
          - { target: x86_64-apple-darwin,         runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu,    runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,   runner: ubuntu-latest, cross: true }
          - { target: x86_64-pc-windows-msvc,      runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build stamps the commit; a shallow clone hides it
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Package
        shell: bash
        env:
          XSYNC_CARGO: ${{ matrix.cross && 'cross' || 'cargo' }}
        run: scripts/package-release.sh ${{ matrix.target }} dist

      # .deb and .rpm are built only where the binary is native: nfpm packages an
      # already-built artifact, and the glibc floor the package declares has to
      # describe the binary actually inside it.
      - name: Linux packages
        if: contains(matrix.target, 'linux') && !matrix.cross
        run: |
          set -euo pipefail
          if ! command -v nfpm >/dev/null 2>&1; then
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            export PATH="$PATH:$(go env GOPATH)/bin"
          fi
          scripts/package-linux.sh ${{ matrix.target }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: xsync-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      # Sigstore-backed, keyless: binds each artifact to this workflow run and
      # commit, with no private key for the project to hold, rotate, or lose.
      # This is the primary integrity story -- see docs/verifying-downloads.md.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      # Prove the published checksums actually describe the published files.
      # A SHA256SUMS generated in the same step that moves the artifacts could
      # be wrong in ways nobody notices until a user reports a bad download.
      - name: Verify checksums against the artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          count=$(find . -type f ! -name SHA256SUMS | wc -l)
          echo "verified $count artifacts"
          if [ "$count" -lt 5 ]; then
            echo "::error::expected one artifact per Tier 1 target, found $count"
            exit 1
          fi

      # Signing is opt-in on secrets being present. It fails closed: a secret
      # that is configured but unusable stops the release rather than silently
      # publishing unsigned artifacts, which is the failure mode that matters.
      # See docs/verifying-downloads.md for what is and is not signed today.
      - name: macOS Developer ID signing
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          echo "::error::macOS signing secret is set but the signing step is not implemented (D3.1)"
          exit 1

      - name: Windows Authenticode signing
        if: env.WINDOWS_CERT_PFX != ''
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          echo "::error::Windows signing secret is set but the signing step is not implemented (D3.2)"
          exit 1
      # Package-manager manifests are rendered from the published checksums, so
      # they can only ever describe artifacts that actually shipped.
      - name: Render package manifests
        run: scripts/render-manifests.sh "${{ needs.verify.outputs.version }}" dist/SHA256SUMS dist/manifests

      - name: Publish release
        # Never on workflow_dispatch: that path exists precisely so the pipeline
        # can be exercised without producing a public release.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file <(scripts/release-notes.sh "${GITHUB_REF_NAME#v}") \
            --verify-tag
      - name: Dry run summary
        if: github.ref_type != 'tag'
        run: |
          echo "### Dry run: artifacts built, nothing published" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY"

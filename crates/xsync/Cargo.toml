[package]
name = "xsync"
build = "build.rs"
# Without this `cargo run` is ambiguous whenever the test-only fake-rsh helper
# is present alongside the real binary.
default-run = "xs"
description = "High-performance rsync replacement built on a parallel pipeline and BLAKE3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The test-only fake-rsh helper is auto-discovered from src/bin/ when building
# from this repository, but is excluded from the published package: cargo
# installs *every* bin in a package, so shipping it would put a test harness on
# the PATH of anyone running `cargo install xsync`.
exclude = ["src/bin/fake-rsh.rs", "tests/"]

[[bin]]
name = "xs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
indicatif = "0.17"
serde_json = "1"
thiserror = "2"
# A path dependency alone cannot be published: crates.io needs a version
# requirement to resolve against. Keep this in step with workspace.package
# version on release (D2.3).
xsync-core = { path = "../xsync-core", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
xsync-bench = { path = "../../benches" }

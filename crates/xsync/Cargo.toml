[package]
name = "xsync"
build = "build.rs"
description = "High-performance rsync replacement built on a parallel pipeline and BLAKE3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "xs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
serde_json = "1"
thiserror = "2"
xsync-core = { path = "../xsync-core" }

[dev-dependencies]
tempfile = "3"
xsync-bench = { path = "../../benches" }

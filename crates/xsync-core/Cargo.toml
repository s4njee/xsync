[package]
name = "xsync-core"
description = "xsync engine library: scanner, planner, strategies, protocol, transports, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1", features = ["prefer_intrinsics"] }
crossbeam-channel = "0.5"
filetime = "0.2"
# Free/total/available space without FFI. The workspace denies `unsafe_code`,
# and `statvfs`/`GetDiskFreeSpaceEx` are the only other way to answer `StatFs`
# (`xsyncv3.md` E5-S3). Default features are `sync` only, so no async runtime
# comes with it.
fs4 = "1"
fslock = "0.2"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
md-5 = "0.10"
redb = "2.6.3"
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
zstd = "0.13"

# `xattr` is Unix-only and does not compile on Windows. The dropped-metadata
# preflight already gates every use behind `#[cfg(unix)]`.
[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]

[workspace]
resolver = "2"
members = [
    "benches",
    "benches/engine",
    "crates/xsync",
    "crates/xsync-client",
    "crates/xsync-core",
]
# `benches/engine` holds Unix-only research spikes (`xsync-remote-spike` uses
# `MetadataExt`, `PermissionsExt` and `CommandExt::exec` throughout) and is not
# part of the product. Excluding it from the default set keeps `cargo build` and
# `cargo test` green on Windows without pretending to port those tools. Build
# them explicitly with `-p xsync-engine-bench` on a Unix host.
default-members = [
    "benches",
    "crates/xsync",
    "crates/xsync-client",
    "crates/xsync-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
version = "0.1.0"
authors = ["xsync contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/s4njee/xsync"
homepage = "https://github.com/s4njee/xsync"
readme = "README.md"
keywords = ["rsync", "sync", "backup", "file-transfer", "blake3"]
categories = ["command-line-utilities", "filesystem"]

# Shared lints for every crate in the workspace.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Shared, tighter release profile (applies to the binary and all deps).
[profile.release]
lto = true
codegen-units = 1
strip = true
